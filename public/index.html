<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AMatch - 정산 대사 서비스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; letter-spacing: -0.015em; }
  body { margin: 0; background: #f8fafc; color: #0f172a; }
  .layout { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar { width: 248px; background: #fff; border-right: 1px solid #e2e8f0; padding: 1.25rem 0.75rem; flex-shrink: 0; }
  .sidebar h2 { font-size: 1.25rem; font-weight: 700; margin: 0 0.5rem; }
  .sidebar .sub { color: #64748b; font-size: 0.8rem; margin: 0 0.5rem 1.5rem; }
  .nav-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1rem; border-radius: 0.5rem; cursor: pointer;
    font-size: 0.95rem; font-weight: 500; color: #64748b; transition: background 0.15s; user-select: none; }
  .nav-item:hover { background: #f1f5f9; }
  .nav-item.active { background: #f1f5f9; color: #0f172a; font-weight: 600; }

  /* Main */
  .main { flex: 1; padding: 2rem 2.5rem; max-width: 1280px; }
  h1 { font-size: 1.875rem; font-weight: 700; margin: 0 0 1.5rem; }
  h3 { font-size: 1.125rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
  .muted { color: #64748b; }

  .alert { padding: 0.85rem 1rem; border-radius: 0.5rem; font-size: 0.9rem; margin-bottom: 1.25rem; }
  .alert.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .alert.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .alert.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); margin-bottom: 1.25rem; }
  .row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .col { flex: 1; min-width: 240px; }

  label.fld { display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin: 0.75rem 0 0.35rem; }
  select, input[type=text] { width: 100%; padding: 0.55rem 0.7rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 0.9rem; background: #fff; }
  input[type=file] { width: 100%; font-size: 0.85rem; padding: 0.5rem; border: 1px dashed #cbd5e1; border-radius: 0.5rem; background: #f8fafc; }

  button { font-family: inherit; cursor: pointer; border: none; border-radius: 0.5rem; font-weight: 600; transition: opacity 0.15s; }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: #2563eb; color: #fff; padding: 0.75rem 1.25rem; font-size: 0.95rem; width: 100%; }
  .btn-sm { padding: 0.45rem 0.85rem; font-size: 0.8rem; }
  .btn-outline { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
  .btn-danger { background: #fff; color: #dc2626; border: 1px solid #fecaca; }

  /* Metric cards */
  .metrics { display: flex; gap: 1rem; flex-wrap: wrap; margin: 0.5rem 0 1.5rem; }
  .metric { flex: 1; min-width: 200px; background: #fff; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 1.25rem; box-shadow: 0 1px 2px rgb(0 0 0 / 0.05); }
  .metric .label { color: #64748b; font-weight: 500; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
  .metric .value { font-weight: 700; font-size: 1.5rem; margin-top: 0.35rem; }
  .delta { font-size: 0.72rem; font-weight: 600; padding: 0.12rem 0.5rem; border-radius: 9999px; margin-left: 0.5rem; }
  .delta.red { color: #ef4444; background: #fee2e2; } .delta.blue { color: #3b82f6; background: #dbeafe; } .delta.gray { color: #64748b; background: #f1f5f9; }
  .info-icon { color: #94a3b8; border: 1px solid #cbd5e1; border-radius: 50%; width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; cursor: help; }

  /* Tabs */
  .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid #e2e8f0; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .tab { padding: 0.6rem 1rem; cursor: pointer; font-size: 0.9rem; font-weight: 500; color: #64748b; border-bottom: 2px solid transparent; }
  .tab.active { color: #0f172a; font-weight: 600; border-bottom-color: #2563eb; }

  /* Tables */
  .tbl-wrap { border: 1px solid #e2e8f0; border-radius: 0.5rem; overflow: auto; background: #fff; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.tbl th { padding: 0.7rem 1rem; border-bottom: 1px solid #e2e8f0; color: #64748b; font-weight: 500; text-align: right; white-space: nowrap; background: #fff; }
  table.tbl th:first-child { text-align: left; }
  table.tbl td { padding: 0.65rem 1rem; border-bottom: 1px solid #e2e8f0; color: #334155; text-align: right; white-space: nowrap; }
  table.tbl td:first-child { text-align: left; }
  table.tbl tr:last-child td { border-bottom: none; }
  table.tbl tr.total td { background: #f1f5f9; font-weight: 700; color: #0f172a; }
  .pos { color: #ef4444; font-weight: 600; } .neg { color: #3b82f6; font-weight: 600; }
  .badge { display: inline-block; border-radius: 9999px; padding: 3px 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }

  .empty { text-align: center; padding: 5rem 2rem; background: #fff; border: 1px dashed #e2e8f0; border-radius: 1rem; }
  .empty .t { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
  .hidden { display: none !important; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .saved-item { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; margin-bottom: 0.75rem; background: #fff; }
  .saved-item .meta { font-size: 0.8rem; color: #64748b; margin-top: 0.2rem; }
  .saved-item .name { font-weight: 600; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2>🚀 AMatch</h2>
    <p class="sub">정산 대사 시스템</p>
    <div class="nav-item active" data-page="setup">📂 데이터 세팅</div>
    <div class="nav-item" data-page="dashboard">📊 정산 대시보드</div>
  </aside>

  <main class="main">
    <h1>AMatch 정산 대사 시스템</h1>
    <div id="msg"></div>

    <!-- 화면 1: 데이터 세팅 -->
    <section id="page-setup">
      <div class="alert info">📅 정산월을 선택하고 파일을 업로드한 후 분석을 시작해주세요.</div>
      <div class="card">
        <h3 style="margin-top:0">정산 대상월 선택</h3>
        <div class="row">
          <div class="col" style="max-width:140px">
            <label class="fld">연도</label>
            <select id="sel-year"></select>
          </div>
          <div class="col" style="max-width:140px">
            <label class="fld">월</label>
            <select id="sel-month"></select>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col card">
          <h3 style="margin-top:0">📍 필수 데이터</h3>
          <label class="fld">1. 카카오 빌링 전체 (요약본)</label>
          <input type="file" id="f-bill" accept=".csv,.xlsx" />
          <label class="fld">2. 더존 세금계산서 발행 데이터</label>
          <input type="file" id="f-sap" accept=".csv,.xlsx" />
          <label class="fld">3. 카카오 현금영수증 데이터</label>
          <input type="file" id="f-rec" accept=".csv,.xlsx" />
          <label class="fld">4. DAUM 내부결제 데이터</label>
          <input type="file" id="f-axz" accept=".csv,.xlsx" />
        </div>
        <div class="col card">
          <h3 style="margin-top:0">📍 PG 상세 내역 (선택)</h3>
          <label class="fld">PG 상세 파일들 (다중 선택 가능)</label>
          <input type="file" id="f-pg" accept=".csv,.xlsx" multiple />
        </div>
      </div>
      <button class="btn-primary" id="btn-analyze">🚀 데이터 분석 및 대사 시작</button>
    </section>

    <!-- 화면 2: 대시보드 -->
    <section id="page-dashboard" class="hidden"></section>
  </main>
</div>

<script>
const API = ""; // 동일 도메인
let currentResult = null;   // 현재 분석/불러온 결과
let activeTab = 0;

// ---------- 유틸 ----------
const $ = (s) => document.querySelector(s);
const won = (v) => (v == null ? "-" : Math.round(v).toLocaleString("ko-KR") + "원");
const num = (v) => (v == null ? "-" : Math.round(v).toLocaleString("ko-KR"));
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function showMsg(text, type = "info") {
  $("#msg").innerHTML = `<div class="alert ${type}">${esc(text)}</div>`;
  if (type === "success") setTimeout(() => { $("#msg").innerHTML = ""; }, 4000);
}

function signClass(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }

// 피벗/일반 테이블 렌더
function pivotTable(p) {
  if (!p || !p.rows || !p.rows.length) return '<p class="muted">내역 없음</p>';
  const cols = p.columns;
  let h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>';
  cols.forEach(c => h += `<th>${esc(c)}</th>`);
  h += "</tr></thead><tbody>";
  p.rows.forEach(r => {
    const isTotal = String(r[cols[0]]).trim() === "합계" || String(r[cols[0]]).trim() === "총 합계";
    h += `<tr class="${isTotal ? "total" : ""}">`;
    cols.forEach((c, i) => {
      const v = r[c];
      h += `<td>${i === 0 ? esc(v) : num(v)}</td>`;
    });
    h += "</tr>";
  });
  return h + "</tbody></table></div>";
}

// 일반 records 테이블. colorCols: 부호 색상 적용할 컬럼명 배열
function recordsTable(rows, columns, opts = {}) {
  if (!rows || !rows.length) return `<div class="alert success">🎉 ${opts.emptyMsg || "내역이 일치합니다."}</div>`;
  const moneyCols = opts.moneyCols || [];
  const colorCols = opts.colorCols || [];
  const badgeCol = opts.badgeCol;
  const badgeMap = opts.badgeMap || {};
  let h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>';
  columns.forEach(c => h += `<th>${esc(c)}</th>`);
  h += "</tr></thead><tbody>";
  rows.forEach(r => {
    h += "<tr>";
    columns.forEach(c => {
      let v = r[c];
      if (c === badgeCol) {
        const st = badgeMap[v] || { bg: "#f1f5f9", fg: "#475569" };
        h += `<td style="text-align:left"><span class="badge" style="background:${st.bg};color:${st.fg}">${esc(v)}</span></td>`;
      } else if (moneyCols.includes(c)) {
        const cls = colorCols.includes(c) ? signClass(v) : "";
        h += `<td class="${cls}">${num(v)}</td>`;
      } else {
        h += `<td style="text-align:left">${esc(v)}</td>`;
      }
    });
    h += "</tr>";
  });
  return h + "</tbody></table></div>";
}

const REC_BADGE = {
  "익월 발행 예정건 (소거)": { bg: "#e0f2fe", fg: "#0369a1" },
  "전월 말일 결제건 (합산)": { bg: "#fee2e2", fg: "#b91c1c" },
  "구다음결제건": { bg: "#f3e8ff", fg: "#7e22ce" },
  "결제내역 상태 확인필요": { bg: "#fef3c7", fg: "#b45309" },
  "기타 확인 필요": { bg: "#f1f5f9", fg: "#475569" },
};

function metric(label, value, opts = {}) {
  const help = opts.help ? `<span class="info-icon" title="${esc(opts.help)}">ⓘ</span>` : "";
  const delta = opts.delta ? `<span class="delta ${opts.deltaColor || "gray"}">${esc(opts.delta)}</span>` : "";
  const vc = opts.valColor ? `color:${opts.valColor}` : "";
  return `<div class="metric"><div class="label">${esc(label)} ${help}</div>
    <div class="value" style="${vc}">${value}${delta}</div></div>`;
}

// ---------- 대시보드 렌더 ----------
function renderDashboard() {
  const sec = $("#page-dashboard");
  if (!currentResult) {
    sec.innerHTML = `<div class="empty"><div class="t">데이터 등록 필요</div>
      <p class="muted">대사 진행을 위해 데이터를 먼저 등록해주세요.</p>
      <button class="btn-primary" style="max-width:260px;margin:1rem auto 0" onclick="go('setup')">✨ 데이터 등록하러 가기</button></div>`;
    return;
  }
  const d = currentResult, s = d.summary;
  const md = s.main_diff;
  const mdStr = (md > 0 ? "+" : "") + num(md) + "원";
  const dr = s.diff_rec, drStr = (dr > 0 ? "+" : "") + num(dr) + "원";

  const tabs = ["📊 DAUM 정산", "🔄 PG", "🧾 현금영수증", "🏢 세금계산서", "💡 정산 제외"];
  let h = `<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
      <div><strong>정산 대상월: ${esc(d.target_month)}</strong> <span class="muted">· 생성 ${esc(d.generated_at || "")}</span></div>
      <button class="btn-primary btn-sm" style="width:auto" id="btn-export" onclick="exportExcel()">📊 엑셀 다운로드</button>
    </div>`;

  h += `<h3>📊 정산 총괄 요약</h3><div class="metrics">
    ${metric("DAUM 최종매출인식금액", won(s.total_axz))}
    ${metric("카카오 빌링 합계", won(s.total_k_bill))}
    ${metric("최종 차액", mdStr, { delta: mdStr, deltaColor: md > 0 ? "red" : md < 0 ? "blue" : "gray" })}
  </div>`;

  h += '<div class="tabs">' + tabs.map((t, i) => `<div class="tab ${i === activeTab ? "active" : ""}" onclick="setTab(${i})">${t}</div>`).join("") + "</div>";
  h += '<div id="tab-body"></div>';
  sec.innerHTML = h;
  renderTab();
}

function setTab(i) { activeTab = i; renderTab(); document.querySelectorAll("#page-dashboard .tab").forEach((t, idx) => t.classList.toggle("active", idx === i)); }

function renderTab() {
  const d = currentResult, s = d.summary, b = $("#tab-body");
  if (!b) return;
  if (activeTab === 0) {
    b.innerHTML = `<h3>전체 증빙 신청 현황</h3>${pivotTable(d.pivot_all)}
      <h3>결제완료 내역</h3>${pivotTable(d.pivot_success)}
      <h3>취소완료 내역</h3>${pivotTable(d.pivot_cancel)}
      <h3>부분취소 내역</h3>${pivotTable(d.pivot_partial)}`;
  } else if (activeTab === 1) {
    b.innerHTML = `<h3>결제유형별 PG 요약</h3>${pivotTable({ columns: ["결제유형", "최종매출인식금액", "결제금액", "차액"], rows: d.pg_summary })}
      <h3>결제번호 기준 상세 불일치 (원본 대사)</h3>
      ${recordsTable(d.mismatch_pg, ["결제번호", "결제수단", "DAUM", "카카오원본", "차액"],
        { moneyCols: ["DAUM", "카카오원본", "차액"], colorCols: ["차액"], emptyMsg: "상세 내역이 일치합니다." })}`;
  } else if (activeTab === 2) {
    const pm = s.prev_month_end_sum;
    b.innerHTML = `<p><strong>1단계: DAUM 대상액 보정 (시차 결제건 조정)</strong></p>
      <div class="metrics">
        ${metric("DAUM 전체(원본)", won(s.raw_total_axz_rec))}
        ${metric("익월 발행 예정건 (소거)", "-" + won(s.end_of_month_sum), { valColor: "#0ea5e9", help: "정산월 말일 결제 후 익월 1일자 자진신고 처리될 거래로 정산월 증빙에서 제외" })}
        ${metric("전월 말일 결제건 (합산)", (pm >= 0 ? "+" : "") + won(pm), { valColor: pm >= 0 ? "#ef4444" : "#0ea5e9", help: "전월 말일 결제 후 정산월 1일 자진발급된 건으로 이번 달에 합산" })}
        ${metric("보정된 DAUM 대상 총액", won(s.adjusted_axz_rec))}
      </div>
      <p><strong>2단계: 카카오 실제 발행액 비교</strong></p>
      <div class="metrics">
        ${metric("보정된 DAUM 대상 (DAUM)", won(s.adjusted_axz_rec))}
        ${metric("카카오 실제 발행 (카카오)", won(s.total_k_rec))}
        ${metric("최종 발행 차액", (s.diff_rec > 0 ? "+" : "") + won(s.diff_rec), { delta: (s.diff_rec > 0 ? "+" : "") + num(s.diff_rec) + "원", deltaColor: s.diff_rec > 0 ? "red" : s.diff_rec < 0 ? "blue" : "gray" })}
      </div>
      <h3>건별 상세 불일치</h3>
      ${recRecTable(d)}`;
  } else if (activeTab === 3) {
    // 컬럼 구성(신청일자 참고열 유무 · ERP 양식명)은 서버가 내려준 목록을 그대로 사용
    const erpName = d.erp_format || "더존";
    const taxCols = d.err_tax_columns || ["사업자번호", "최종매출인식금액", `${erpName} 원본`, "차액"];
    const taxMoney = d.err_tax_money_columns || ["최종매출인식금액", `${erpName} 원본`, "차액"];
    b.innerHTML = `<h3>세금계산서 불일치 (DAUM vs ${esc(erpName)})</h3>
      ${recordsTable(d.err_tax, taxCols,
        { moneyCols: taxMoney, colorCols: ["차액"], emptyMsg: "세금계산서 내역이 일치합니다." })}`;
  } else {
    b.innerHTML = `<div class="alert info">💡 <strong>'구다음메일 결제건'</strong> 내역입니다. 정산에서 자동 제외된 내역입니다.</div>
      <h3>DAUM 결제내역 <span class="muted" style="font-weight:400">(비고/상품명에 '구다음' 포함)</span></h3>
      ${d.old_daum && d.old_daum.length
        ? recordsTable(d.old_daum, ["거래일시", "결제수단", "결제상태", "User ID", "결제ID", "상품명", "세금유형", "최종매출인식금액"], { moneyCols: ["최종매출인식금액"] })
        : '<p class="muted">제외 항목 없음</p>'}
      <h3 style="margin-top:1.5rem">현금영수증 <span class="muted" style="font-weight:400">(채널 = '다음메일')</span></h3>
      ${d.old_daum_rec && d.old_daum_rec.length
        ? recordsTable(d.old_daum_rec, ["일시", "계정 ID", "채널", "전송유형", "요청금액"], { moneyCols: ["요청금액"] })
        : '<p class="muted">제외 항목 없음</p>'}`;
  }
}

function recRecTable(d) {
  if (!d.err_rec || !d.err_rec.length) return '<div class="alert success">🎉 상세 내역이 모두 일치합니다.</div>';
  const ADJ = ["익월 발행 예정건 (소거)", "전월 말일 결제건 (합산)"];
  const adj = d.err_rec.filter(r => ADJ.includes(r["사유"]));
  const status = d.err_rec.filter(r => r["사유"] === "결제내역 상태 확인필요");
  const etc = d.err_rec.filter(r => !ADJ.includes(r["사유"]) && r["사유"] !== "결제내역 상태 확인필요");
  const cols = ["거래일시", "발행일시", "계정 ID", "DAUM", "카카오원본", "차액", "사유"];
  const opts = { moneyCols: ["DAUM", "카카오원본", "차액"], colorCols: ["차액"], badgeCol: "사유", badgeMap: REC_BADGE };
  const section = (title, rows, emptyMsg) =>
    `<h4 style="margin:1rem 0 0.5rem">${title} <span class="muted" style="font-weight:400">· ${rows.length}건</span></h4>`
    + (rows.length ? recordsTable(rows, cols, opts) : `<p class="muted">${emptyMsg}</p>`);
  return section("시차보정 대상 (소거 · 합산)", adj, "해당 없음")
    + section("결제내역 상태 확인필요 (카카오 취소 · DAUM 미반영)", status, "해당 없음")
    + section("기타 확인 필요 (대사 불일치 · 별도 검토)", etc, "확인 필요 건 없음");
}

// ---------- 분석 ----------
async function analyze() {
  const files = { bill: $("#f-bill").files[0], sap: $("#f-sap").files[0], rec: $("#f-rec").files[0], axz: $("#f-axz").files[0] };
  if (!files.bill || !files.sap || !files.rec || !files.axz) { showMsg("필수 데이터 4개를 모두 업로드해주세요.", "error"); return; }
  const year = $("#sel-year").value, month = $("#sel-month").value.padStart(2, "0");
  const tm = `${year}-${month}`;
  const fd = new FormData();
  fd.append("bill", files.bill); fd.append("sap", files.sap); fd.append("rec", files.rec); fd.append("axz", files.axz);
  for (const f of $("#f-pg").files) fd.append("pg_files", f);

  const btn = $("#btn-analyze");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 정밀 로직 분석 및 대사 진행 중...';
  try {
    const res = await fetch(`${API}/api/analyze?target_month=${tm}`, { method: "POST", body: fd });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || `오류 (${res.status})`); }
    currentResult = await res.json();
    activeTab = 0;
    go("dashboard");
    showMsg("✅ 정산 데이터 분석이 성공적으로 완료되었습니다!", "success");
  } catch (e) { showMsg("⚠️ " + e.message, "error"); }
  finally { btn.disabled = false; btn.innerHTML = "🚀 데이터 분석 및 대사 시작"; }
}

// ---------- 엑셀 다운로드 ----------
async function exportExcel() {
  const files = { bill: $("#f-bill").files[0], sap: $("#f-sap").files[0], rec: $("#f-rec").files[0], axz: $("#f-axz").files[0] };
  if (!files.bill || !files.sap || !files.rec || !files.axz) {
    showMsg("엑셀 생성을 위해 '데이터 세팅'에서 원본 파일을 다시 선택한 뒤 분석해주세요.", "error");
    return;
  }
  const tm = currentResult ? currentResult.target_month : `${$("#sel-year").value}-${String($("#sel-month").value).padStart(2, "0")}`;
  const fd = new FormData();
  fd.append("bill", files.bill); fd.append("sap", files.sap); fd.append("rec", files.rec); fd.append("axz", files.axz);
  for (const f of $("#f-pg").files) fd.append("pg_files", f);

  const btn = $("#btn-export");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 엑셀 생성 중...';
  try {
    const res = await fetch(`${API}/api/export?target_month=${tm}`, { method: "POST", body: fd });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || `오류 (${res.status})`); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `AMatch_정산_${tm}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showMsg("엑셀 파일을 다운로드했습니다.", "success");
  } catch (e) { showMsg("⚠️ " + e.message, "error"); }
  finally { btn.disabled = false; btn.innerHTML = "📊 엑셀 다운로드"; }
}

// ---------- 네비게이션 ----------
function go(page) {
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.page === page));
  ["setup", "dashboard"].forEach(p => $("#page-" + p).classList.toggle("hidden", p !== page));
  if (page === "dashboard") renderDashboard();
}

// ---------- 초기화 ----------
function init() {
  const ys = $("#sel-year"), ms = $("#sel-month");
  for (let y = 2020; y <= 2030; y++) ys.innerHTML += `<option value="${y}">${y}</option>`;
  for (let m = 1; m <= 12; m++) ms.innerHTML += `<option value="${m}">${m}</option>`;
  const now = new Date();
  let dy = now.getFullYear(), dm = now.getMonth(); // getMonth: 0-11 → 전월
  if (dm === 0) { dm = 12; dy -= 1; }
  ys.value = dy; ms.value = dm;

  document.querySelectorAll(".nav-item").forEach(n => n.addEventListener("click", () => go(n.dataset.page)));
  $("#btn-analyze").addEventListener("click", analyze);
}
init();
</script>
